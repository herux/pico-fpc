# Free Pascal cross-compilation configuration for RP2040
#
# Usage: fpc @fpc-rp2040.cfg yourprogram.pas

# Processor selection (must be first)
-Parm

# Target: ARM embedded (bare metal)
-Tembedded

# Processor: Cortex-M0+ (ARMv6-M)
-Cparmv6m

# Unit paths
-Fu/Users/herux/fpcupdeluxe/fpc/units/arm-embedded
-Fusrc/rtl
-Fusrc/hardware
-Fusrc/pico

# Output
-FEbuild

# Binutils path
-XP/opt/homebrew/bin/arm-embedded-

# Optimization
-O2

# Smart linking
-XX
-CX

# Generate debug info (optional, comment out for release)
# -g
# -gl
